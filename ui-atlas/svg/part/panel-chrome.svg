  <rect width="960" height="480" fill="var(--fa-surface-panel)"/>

  <text x="24" y="50" font-size="11" fill="var(--fa-text-muted)">普通态</text>
  <text x="90" y="50" font-size="11" fill="var(--fa-text-muted)">标题栏 36 · 整行拖动（OpenHand）</text>
  <text x="500" y="50" font-size="11" fill="var(--fa-text-muted)">最大化态</text>
  <text x="572" y="50" font-size="11" fill="var(--fa-text-muted)">还原图标（Minimize）恢复原几何</text>

  <g aria-label="普通态浮窗">
    <rect x="24" y="64" width="430" height="280" rx="8" fill="var(--fa-surface-base)" stroke="var(--fa-separator)"/>
    <rect x="24" y="99" width="430" height="1" fill="var(--fa-separator-light)"/>

    <text x="40" y="87" font-size="14" fill="var(--fa-text-primary)">媒体统计</text>
    <use href="#fa-icon-maximize" x="389" y="74" width="16" height="16" color="var(--fa-text-secondary)"/>
    <use href="#fa-icon-x" x="423" y="74" width="16" height="16" color="var(--fa-text-primary)"/>

    <text x="36" y="122" font-size="12" fill="var(--fa-text-secondary)">浮窗内容由插件渲染</text>
    <rect x="36" y="136" width="181" height="64" rx="8" fill="var(--fa-surface-card)" stroke="var(--fa-separator)"/>
    <text x="48" y="158" font-size="12" fill="var(--fa-text-primary)">内容区域</text>
    <text x="48" y="176" font-size="11" fill="var(--fa-text-muted)">由挂载方提供</text>
    <rect x="227" y="136" width="181" height="64" rx="8" fill="var(--fa-surface-card)" stroke="var(--fa-separator)"/>
    <text x="239" y="158" font-size="12" fill="var(--fa-text-primary)">内容区域</text>
    <text x="239" y="176" font-size="11" fill="var(--fa-text-muted)">由挂载方提供</text>
    <text x="36" y="222" font-size="11" fill="var(--fa-text-muted)">标题、内容与关闭行为归插件；几何、按钮与手柄归 panels::mount。</text>

    <rect x="20" y="60" width="8" height="8" fill="var(--fa-accent)" fill-opacity="0.9"/>
    <rect x="450" y="60" width="8" height="8" fill="var(--fa-accent)" fill-opacity="0.9"/>
    <rect x="20" y="336" width="8" height="8" fill="var(--fa-accent)" fill-opacity="0.9"/>
    <rect x="450" y="336" width="8" height="8" fill="var(--fa-accent)" fill-opacity="0.9"/>
    <rect x="234" y="61.5" width="5" height="5" fill="var(--fa-accent)" fill-opacity="0.9"/>
    <rect x="234" y="339.5" width="5" height="5" fill="var(--fa-accent)" fill-opacity="0.9"/>
    <rect x="21.5" y="201.5" width="5" height="5" fill="var(--fa-accent)" fill-opacity="0.9"/>
    <rect x="451.5" y="201.5" width="5" height="5" fill="var(--fa-accent)" fill-opacity="0.9"/>
  </g>

  <g aria-label="最大化态浮窗">
    <rect x="500" y="64" width="436" height="356" rx="8" fill="var(--fa-surface-base)" stroke="var(--fa-separator)"/>
    <rect x="500" y="99" width="436" height="1" fill="var(--fa-separator-light)"/>

    <text x="516" y="87" font-size="14" fill="var(--fa-text-primary)">媒体统计</text>
    <use href="#fa-icon-minimize" x="871" y="74" width="16" height="16" color="var(--fa-text-secondary)"/>
    <use href="#fa-icon-x" x="905" y="74" width="16" height="16" color="var(--fa-text-primary)"/>

    <text x="512" y="122" font-size="12" fill="var(--fa-text-secondary)">最大化态内容区</text>
    <rect x="512" y="136" width="200" height="80" rx="8" fill="var(--fa-surface-card)" stroke="var(--fa-separator)"/>
    <text x="524" y="160" font-size="12" fill="var(--fa-text-primary)">内容区域</text>
    <text x="524" y="178" font-size="11" fill="var(--fa-text-muted)">随视口扩展</text>
    <rect x="720" y="136" width="200" height="80" rx="8" fill="var(--fa-surface-card)" stroke="var(--fa-separator)"/>
    <text x="732" y="160" font-size="12" fill="var(--fa-text-primary)">内容区域</text>
    <text x="732" y="178" font-size="11" fill="var(--fa-text-muted)">随视口扩展</text>
    <text x="512" y="244" font-size="11" fill="var(--fa-text-muted)">标题栏与关闭按钮保持 36 高，不显示 8 向缩放手柄。</text>
  </g>

  <use href="#fa-icon-keyboard" x="24" y="350" width="16" height="16" color="var(--fa-text-muted)"/>
  <text x="48" y="362" font-size="11" fill="var(--fa-text-muted)">Esc 关闭浮窗（焦点在浮窗内）</text>
  <text x="280" y="362" font-size="11" fill="var(--fa-text-muted)">8 向缩放手柄：边 5 px / 角 8 px</text>
  <text x="24" y="384" font-size="11" fill="var(--fa-text-muted)">标题栏 36 px · 按钮 30 × 30 · 浮窗圆角 8 px</text>
  <text x="500" y="444" font-size="11" fill="var(--fa-text-muted)">Esc 仍关闭；关闭后由调用方决定是否保留原几何。</text>
</svg>
