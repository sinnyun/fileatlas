<rect width="860" height="400" fill="var(--fa-surface-panel)"/>

  <text x="110" y="32" font-size="11" fill="var(--fa-text-muted)">卡片菜单</text>
  <g aria-label="卡片菜单">
    <rect x="112" y="47" width="290" height="176" rx="8" fill="var(--fa-shadow-overlay)"/>
    <rect x="110" y="44" width="290" height="176" rx="8" fill="var(--fa-native-popover)" stroke="var(--fa-native-border)"/>

    <use href="#fa-icon-external-link" x="124" y="55" width="16" height="16" color="var(--fa-text-secondary)"/>
    <text x="148" y="68" font-size="14" fill="var(--fa-native-popover-foreground)">用默认应用打开</text>

    <rect x="114" y="78" width="282" height="30" rx="4" fill="var(--fa-fill-hover)"/>
    <use href="#fa-icon-folder" x="124" y="85" width="16" height="16" color="var(--fa-text-primary)"/>
    <text x="148" y="98" font-size="14" fill="var(--fa-native-popover-foreground)">在资源管理器中显示</text>

    <rect x="122" y="113" width="266" height="1" fill="var(--fa-separator)"/>

    <use href="#fa-icon-tag" x="124" y="124" width="16" height="16" color="var(--fa-text-secondary)"/>
    <text x="148" y="137" font-size="14" fill="var(--fa-native-popover-foreground)">标签</text>
    <use href="#fa-icon-chevron-right" x="376" y="124" width="16" height="16" color="var(--fa-text-muted)"/>

    <use href="#fa-icon-star" x="124" y="154" width="16" height="16" color="var(--fa-text-secondary)"/>
    <text x="148" y="167" font-size="14" fill="var(--fa-native-popover-foreground)">评分</text>
    <use href="#fa-icon-chevron-right" x="376" y="154" width="16" height="16" color="var(--fa-text-muted)"/>

    <rect x="122" y="182" width="266" height="1" fill="var(--fa-separator)"/>

    <use href="#fa-icon-trash" x="124" y="193" width="16" height="16" color="var(--fa-danger-text)"/>
    <text x="148" y="206" font-size="14" fill="var(--fa-danger-text)">删除…</text>
  </g>

  <text x="24" y="68" font-size="11" fill="var(--fa-text-muted)">默认</text>
  <text x="24" y="98" font-size="11" fill="var(--fa-text-muted)">悬停</text>
  <text x="24" y="137" font-size="11" fill="var(--fa-text-muted)">子菜单</text>
  <text x="24" y="206" font-size="11" fill="var(--fa-text-muted)">危险项</text>

  <text x="560" y="32" font-size="11" fill="var(--fa-text-muted)">栏位布局菜单</text>
  <g aria-label="栏位布局菜单">
    <rect x="562" y="47" width="240" height="137" rx="8" fill="var(--fa-shadow-overlay)"/>
    <rect x="560" y="44" width="240" height="137" rx="8" fill="var(--fa-native-popover)" stroke="var(--fa-native-border)"/>

    <text x="600" y="68" font-size="14" fill="var(--fa-native-popover-foreground)">单栏</text>

    <rect x="564" y="78" width="232" height="30" rx="4" fill="var(--fa-fill-hover)"/>
    <use href="#fa-icon-check" x="574" y="85" width="16" height="16" color="var(--fa-accent-text)"/>
    <text x="600" y="98" font-size="14" fill="var(--fa-native-popover-foreground)">双栏</text>

    <text x="600" y="128" font-size="14" fill="var(--fa-native-popover-foreground)">四栏</text>

    <rect x="572" y="143" width="216" height="1" fill="var(--fa-separator)"/>

    <text x="600" y="167" font-size="14" fill="var(--fa-native-popover-foreground)">活动栏 1</text>
  </g>

  <text x="470" y="68" font-size="11" fill="var(--fa-text-muted)">默认</text>
  <text x="470" y="98" font-size="11" fill="var(--fa-text-muted)">当前项 + 悬停</text>
  <text x="470" y="143" font-size="11" fill="var(--fa-text-muted)">分隔线</text>

  <text x="560" y="232" font-size="11" fill="var(--fa-text-muted)">预设菜单（空）</text>
  <g aria-label="禁用项">
    <rect x="562" y="247" width="240" height="38" rx="8" fill="var(--fa-shadow-overlay)"/>
    <rect x="560" y="244" width="240" height="38" rx="8" fill="var(--fa-native-popover)" stroke="var(--fa-native-border)"/>
    <text x="574" y="268" font-size="14" fill="var(--fa-native-muted-foreground)">暂无预设，请在插件设置中添加</text>
  </g>
  <text x="470" y="268" font-size="11" fill="var(--fa-text-muted)">禁用</text>

  <text x="24" y="330" font-size="11" fill="var(--fa-text-muted)">菜单项高 30 · 图标 16 · 菜单圆角 8 · 内边距 4/8 · 当前项 check 图标 accent-text</text>
  <text x="24" y="350" font-size="11" fill="var(--fa-text-muted)">native-popover 底与前景 · 分隔线 1 px · 子菜单箭头 chevron-right 16</text>
  <text x="24" y="370" font-size="11" fill="var(--fa-text-muted)">危险项 danger-text · 禁用项 native-muted-foreground</text>
</svg>
