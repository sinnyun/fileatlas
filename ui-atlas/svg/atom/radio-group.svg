  <rect width="640" height="200" fill="var(--fa-surface-panel)"/>

  <g aria-label="搜索范围单选组">
    <text x="12" y="34" font-size="15" font-weight="600" fill="var(--fa-text-primary)">搜索范围</text>
    <rect x="12" y="92" width="320" height="32" rx="6" fill="var(--fa-fill-hover)"/>

    <circle cx="28" cy="64" r="8" fill="none" stroke="var(--fa-accent)" stroke-width="1.5"/>
    <circle cx="28" cy="64" r="3.5" fill="var(--fa-accent)"/>
    <text x="44" y="69" font-size="14" fill="var(--fa-text-primary)">当前文件夹</text>

    <circle cx="28" cy="108" r="8" fill="none" stroke="var(--fa-text-secondary)" stroke-width="1.5"/>
    <text x="44" y="113" font-size="14" fill="var(--fa-text-primary)">包含子文件夹</text>

    <circle cx="28" cy="152" r="8" fill="none" stroke="var(--fa-text-secondary)" stroke-width="1.5"/>
    <text x="44" y="157" font-size="14" fill="var(--fa-text-primary)">整个资料库</text>

    <text x="12" y="188" font-size="11" fill="var(--fa-text-muted)">选中=accent 圆点；未选=text-secondary 描边</text>
  </g>

  <line x1="356" y1="14" x2="356" y2="168" stroke="var(--fa-separator)"/>

  <g aria-label="禁用组">
    <text x="380" y="34" font-size="15" font-weight="600" fill="var(--fa-text-primary)">禁用组</text>

    <circle cx="396" cy="64" r="8" fill="none" stroke="var(--fa-accent)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="396" cy="64" r="3.5" fill="var(--fa-accent)" opacity="0.4"/>
    <text x="412" y="69" font-size="14" fill="var(--fa-text-muted)" fill-opacity="0.6">当前文件夹</text>

    <circle cx="396" cy="108" r="8" fill="none" stroke="var(--fa-text-muted)" stroke-width="1.5" opacity="0.5"/>
    <text x="412" y="113" font-size="14" fill="var(--fa-text-muted)" fill-opacity="0.6">包含子文件夹</text>

    <circle cx="396" cy="152" r="8" fill="none" stroke="var(--fa-text-muted)" stroke-width="1.5" opacity="0.5"/>
    <text x="412" y="157" font-size="14" fill="var(--fa-text-muted)" fill-opacity="0.6">整个资料库</text>

    <text x="380" y="188" font-size="11" fill="var(--fa-text-muted)">禁用：整组圆点与文字降为 text-muted</text>
  </g>
