    <text x="164" y="142" font-size="12" fill="var(--fa-text-primary)">卡片角标：仅本地修改显示</text>
    <text x="164" y="160" font-size="11" fill="var(--fa-text-muted)">24px 圆钮 · surface-elevated 底 · warning-text 圆环</text>
