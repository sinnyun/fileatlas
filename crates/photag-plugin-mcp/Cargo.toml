[package]
name = "photag-plugin-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tracing.workspace = true
base64 = "0.22"
cordis.workspace = true
photag-contracts = { path = "../photag-contracts" }
image = { version = "0.25", default-features = false, features = ["png"] }
photag-plugin-gallery = { path = "../photag-plugin-gallery" }
photag-plugin-columns = { path = "../photag-plugin-columns" }
photag-plugin-workspaces = { path = "../photag-plugin-workspaces" }
photag-plugin-history = { path = "../photag-plugin-history" }
photag-plugin-metadata-export = { path = "../photag-plugin-metadata-export" }
photag-plugin-screenshot = { path = "../photag-plugin-screenshot" }
photag-plugin-database = { path = "../photag-plugin-database" }
photag-plugin-navigation = { path = "../photag-plugin-navigation" }
photag-plugin-quicklook = { path = "../photag-plugin-quicklook" }
photag-plugin-tagging = { path = "../photag-plugin-tagging" }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror = "2"

photag-plugin-i18n = { path = "../photag-plugin-i18n" }
photag-plugin-settings = { path = "../photag-plugin-settings" }
photag-ui-bridge = { path = "../photag-ui-bridge" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }


[lints]
workspace = true
