[package]
name = "photag-plugin-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
cordis.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
photag-plugin-gallery = { path = "../photag-plugin-gallery" }
photag-plugin-media-playback = { path = "../photag-plugin-media-playback" }
photag-plugin-metadata-export = { path = "../photag-plugin-metadata-export" }
photag-plugin-database = { path = "../photag-plugin-database" }
photag-plugin-file-operations = { path = "../photag-plugin-file-operations" }
photag-plugin-navigation = { path = "../photag-plugin-navigation" }
photag-plugin-preview = { path = "../photag-plugin-preview" }
photag-plugin-tagging = { path = "../photag-plugin-tagging" }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
