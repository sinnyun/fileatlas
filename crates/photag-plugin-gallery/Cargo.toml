[package]
name = "photag-plugin-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
photag-plugin-ai = { path = "../photag-plugin-ai" }
photag-plugin-watcher = { path = "../photag-plugin-watcher" }
tracing.workspace = true
photag-plugin-navigation = { path = "../photag-plugin-navigation" }
photag-plugin-grouping = { path = "../photag-plugin-grouping" }
