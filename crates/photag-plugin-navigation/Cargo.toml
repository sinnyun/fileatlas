[package]
name = "photag-plugin-navigation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
cordis.workspace = true
gpui-kit.workspace = true
rfd = { version = "0.15", default-features = false }
tokio.workspace = true
photag-plugin-database = { path = "../photag-plugin-database" }
photag-contracts = { path = "../photag-contracts" }
photag-plugin-indexing = { path = "../photag-plugin-indexing" }
photag-plugin-thumbnails = { path = "../photag-plugin-thumbnails" }
photag-plugin-watcher = { path = "../photag-plugin-watcher" }
photag-plugin-session = { path = "../photag-plugin-session" }
photag-plugin-tagging = { path = "../photag-plugin-tagging" }
photag-ui-bridge = { path = "../photag-ui-bridge" }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
