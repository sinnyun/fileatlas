name: Rust workspace checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Format and base shell compile
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 1
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node for architecture checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce shared UI polling
        run: node scripts/check-ui-refresh.cjs

      - name: Enforce shared workbench theme
        run: |
          node scripts/check-ui-design-tokens.cjs --self-test
          node scripts/check-ui-design-tokens.cjs
          node scripts/check-ui-geometry-coverage.cjs
          node scripts/check-ui-theme.cjs --self-test
          node scripts/check-ui-theme.cjs

      - name: Enforce architecture and debt ratchets
        run: node scripts/check-architecture.cjs

      - name: Enforce crate layering and database boundaries
        run: node scripts/check-layering.cjs

      - name: Validate feature ledger links and statuses
        run: node scripts/check-feature-ledger.cjs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile base shell and its required plugins
        run: cargo check -p fileatlas-shell --locked
