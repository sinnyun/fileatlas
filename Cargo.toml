[workspace]
resolver = "3"
members = [
    "crates/photag-shell",
    "crates/photag-contracts",
    "crates/photag-ui-bridge",
    "crates/photag-plugin-database",
    "crates/photag-plugin-thumbnails",
    "crates/photag-plugin-indexing",
    "crates/photag-plugin-watcher",
    "crates/photag-plugin-gallery",
    "crates/photag-plugin-everything-search",
    "crates/photag-plugin-launcher",
    "crates/photag-plugin-shortcuts",
    "crates/photag-plugin-clipboard",
    "crates/photag-plugin-grouping",
    "crates/photag-plugin-debug",
    "crates/photag-plugin-navigation",
    "crates/photag-plugin-tagging",
    "crates/photag-plugin-settings",
    "crates/photag-plugin-i18n",
    "crates/photag-plugin-updater",
    "crates/photag-plugin-session",
    "crates/photag-plugin-metadata-export",
    "crates/photag-plugin-file-operations",
    "crates/photag-plugin-quicklook",
    "crates/photag-plugin-ai",
    "crates/photag-plugin-history",
    "crates/photag-plugin-version-info",
    "crates/photag-plugin-versions",
    "crates/photag-plugin-drag-drop",
    "crates/photag-plugin-mcp",
    "crates/photag-plugin-dev-test",
    "crates/photag-plugin-screenshot",
]
default-members = ["crates/photag-shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
tracing = "0.1"
cordis = { package = "cordis-rs", version = "0.11.1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rmcp = { version = "3.5.1", default-features = false, features = ["base64", "macros", "server", "transport-io", "transport-streamable-http-server"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
gpui-kit = "=0.7.1"

# Keep the same Lore GUI engine revision used by the reference workspace.
lore-vm = { git = "https://github.com/BiloxiStudios/loregui.git", rev = "35eaf6ed1273397a5b18a283dda560949bb94ca4", package = "lore-vm" }

[patch.crates-io]
quinn-proto = { git = "https://github.com/EpicGames/lore.git", rev = "da73d9fbe793f8ff10db848c9920b83f63c346f2" }

[profile.dev]
debug = 0
incremental = true

# Media decoders and the native RGBA/BGRA upload conversion must run optimized
# even while application code remains debuggable. A 24 MP JPEG otherwise spends
# several seconds in unoptimized pixel/decoder loops before its full paint.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.gpui-pre]
opt-level = 2

# PNG decoding/filter reconstruction and DEFLATE are separate dependency crates;
# optimizing image alone does not optimize these hot paths in dev builds.
[profile.dev.package."png:0.18.1"]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package."miniz_oxide:0.8.9"]
opt-level = 3

[profile.dev.package."miniz_oxide:0.9.1"]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.test]
debug = 0
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"

